<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola usuarios</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      cursor: none;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #contador {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
    }

    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }

    #reticle::before,
    #reticle::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }

    #reticle::before {
      left: 50%;
      top: -8px;
      width: 2px;
      height: calc(100% + 16px);
      transform: translateX(-50%);
    }

    #reticle::after {
      top: 50%;
      left: -8px;
      width: calc(100% + 16px);
      height: 2px;
      transform: translateY(-50%);
    }

    #player {
      position: absolute;
      left: 0;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff 0%, #f3f3f3 18%, #d7d7d7 36%, #8d8d8d 65%, #4a4a4a 100%);
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), inset -12px -12px 18px rgba(0, 0, 0, 0.3), inset 10px 10px 18px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 2;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    #player::before,
    #player::after {
      content: "";
      position: absolute;
      top: 52px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #111;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    #player::before {
      left: 35px;
    }

    #player::after {
      right: 35px;
    }

    .mouth {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 55px;
      height: 22px;
      border-bottom: 4px solid #1d1d1d;
      border-radius: 0 0 80px 80px;
      transform: translateX(-50%);
    }

    #enemy {
      position: absolute;
      left: 0;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff 0%, #f3f3f3 18%, #d7d7d7 36%, #8d8d8d 65%, #4a4a4a 100%);
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), inset -12px -12px 18px rgba(0, 0, 0, 0.3), inset 10px 10px 18px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 1;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    #enemy::before,
    #enemy::after {
      content: "";
      position: absolute;
      top: 52px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #111;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    #enemy::before {
      left: 35px;
    }

    #enemy::after {
      right: 35px;
    }
  </style>
</head>
<body>
  <div id="contador">Disparos: 0</div>
  <div id="reticle"></div>

  <div id="player" aria-label="Jugador">
    <div class="mouth"></div>
  </div>

  <div id="enemy" aria-label="Enemigo">
    <div class="mouth"></div>
  </div>

  <script>
    const reticle = document.getElementById('reticle');
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const contador = document.getElementById('contador');

    let playerX = 120;
    let playerY = 120;
    let enemyX = 500;
    let enemyY = 250;
    let enemyDx = 3.6;
    let enemyDy = 2.8;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let burst = 0;
    let disparos = 0;
    const keys = {};

    const speed = 7;

    window.addEventListener('pointermove', (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;
      reticle.style.left = event.clientX + 'px';
      reticle.style.top = event.clientY + 'px';
    });

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener('click', () => {
      disparos++;
      contador.textContent = 'Disparos: ' + disparos;

      burst = 2.7 + disparos * 0.5;
      enemyDx = (Math.abs(enemyDx) + 0.35 + disparos * 0.09) * (enemyDx >= 0 ? 1 : -1);
      enemyDy = (Math.abs(enemyDy) + 0.28 + disparos * 0.08) * (enemyDy >= 0 ? 1 : -1);

      enemy.style.filter = 'brightness(1.5) drop-shadow(0 0 16px rgba(255,255,255,0.8))';
      enemy.style.transform = `rotate(${Math.random() * 40 - 20}deg) scale(${1 + disparos * 0.01})`;

      setTimeout(() => {
        enemy.style.filter = 'none';
      }, 120);
    });

    function movePlayer() {
      if (keys['w']) playerY -= speed;
      if (keys['s']) playerY += speed;
      if (keys['a']) playerX -= speed;
      if (keys['d']) playerX += speed;

      playerX = Math.max(0, Math.min(playerX, window.innerWidth - 150));
      playerY = Math.max(0, Math.min(playerY, window.innerHeight - 150));

      player.style.left = playerX + 'px';
      player.style.top = playerY + 'px';
    }

    function moveEnemy() {
      const enemyCenterX = enemyX + 75;
      const enemyCenterY = enemyY + 75;
      const distanceX = playerX + 75 - enemyCenterX;
      const distanceY = playerY + 75 - enemyCenterY;
      const distance = Math.hypot(distanceX, distanceY) || 1;

      if (distance < 220) {
        const force = (220 - distance) / 220;
        enemyX -= (distanceX / distance) * (9 + disparos * 1.6) * force;
        enemyY -= (distanceY / distance) * (9 + disparos * 1.6) * force;
      }

      enemyX += enemyDx * (1 + burst);
      enemyY += enemyDy * (1 + burst);

      if (enemyX <= 0 || enemyX >= window.innerWidth - 150) {
        enemyDx *= -1;
        enemyX = Math.max(0, Math.min(enemyX, window.innerWidth - 150));
      }

      if (enemyY <= 0 || enemyY >= window.innerHeight - 150) {
        enemyDy *= -1;
        enemyY = Math.max(0, Math.min(enemyY, window.innerHeight - 150));
      }

      enemyX = Math.max(0, Math.min(enemyX, window.innerWidth - 150));
      enemyY = Math.max(0, Math.min(enemyY, window.innerHeight - 150));

      enemy.style.left = enemyX + 'px';
      enemy.style.top = enemyY + 'px';
      enemy.style.transform = `rotate(${Math.sin(enemyY / 20) * 12 + Math.random() * 8 - 4}deg)`;

      if (burst > 0) {
        burst *= 0.88;
      }
      if (burst < 0.05) {
        burst = 0;
      }
    }

    function loop() {
      movePlayer();
      moveEnemy();
      requestAnimationFrame(loop);
    }

    player.style.left = playerX + 'px';
    player.style.top = playerY + 'px';
    enemy.style.left = enemyX + 'px';
    enemy.style.top = enemyY + 'px';

    requestAnimationFrame(loop);
  </script>
</body>
</html>
