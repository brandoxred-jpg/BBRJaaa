<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola usuarios</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08090d;
      font-family: Arial, sans-serif;
      cursor: none;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: -1;
      will-change: transform;
    }

    body::before {
      background:
        radial-gradient(ellipse at 18% 44%, rgba(177, 0, 24, 0.8) 0%, transparent 34%),
        radial-gradient(ellipse at 74% 30%, rgba(112, 0, 18, 0.8) 0%, transparent 38%),
        radial-gradient(ellipse at 56% 80%, rgba(224, 20, 30, 0.5) 0%, transparent 32%),
        linear-gradient(145deg, #090b10 12%, #310710 48%, #10070d 76%, #08090d);
      animation: red-tide-flow 22s ease-in-out infinite alternate;
    }

    body::after {
      background:
        repeating-linear-gradient(164deg, transparent 0 48px, rgba(255, 35, 48, 0.11) 50px, transparent 56px 102px),
        linear-gradient(90deg, transparent, rgba(190, 0, 25, 0.17), transparent);
      opacity: 0.65;
      transform: translate3d(0, 0, 0) rotate(-8deg) scale(1.15);
      animation: red-tide-ripple 14s ease-in-out infinite alternate;
    }

    @keyframes red-tide-flow {
      0% {
        transform: translate3d(-4%, -2%, 0) rotate(-5deg) scale(1);
      }
      100% {
        transform: translate3d(4%, 3%, 0) rotate(6deg) scale(1.12);
      }
    }

    @keyframes red-tide-ripple {
      0% {
        transform: translate3d(-2%, -1%, 0) rotate(-8deg) scale(1.15);
      }
      100% {
        transform: translate3d(2%, 1%, 0) rotate(-4deg) scale(1.15);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none;
      }
    }

    #contador {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
    }

    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }

    #reticle::before,
    #reticle::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
    }

    #reticle::before {
      left: 50%;
      top: -8px;
      width: 2px;
      height: calc(100% + 16px);
      transform: translateX(-50%);
    }

    #reticle::after {
      top: 50%;
      left: -8px;
      width: calc(100% + 16px);
      height: 2px;
      transform: translateY(-50%);
    }

    #player {
      position: absolute;
      left: 0;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff 0%, #f3f3f3 18%, #d7d7d7 36%, #8d8d8d 65%, #4a4a4a 100%);
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), inset -12px -12px 18px rgba(0, 0, 0, 0.3), inset 10px 10px 18px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 2;
      will-change: transform;
    }

    #player::before,
    #player::after {
      content: "";
      position: absolute;
      top: 52px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #111;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    #player::before {
      left: 35px;
    }

    #player::after {
      right: 35px;
    }

    .mouth {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 55px;
      height: 22px;
      border-bottom: 4px solid #1d1d1d;
      border-radius: 0 0 80px 80px;
      transform: translateX(-50%);
    }

    #enemy {
      position: absolute;
      left: 0;
      top: 0;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff 0%, #f3f3f3 18%, #d7d7d7 36%, #8d8d8d 65%, #4a4a4a 100%);
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3), inset -12px -12px 18px rgba(0, 0, 0, 0.3), inset 10px 10px 18px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 1;
      will-change: transform;
    }

    #enemy::before,
    #enemy::after {
      content: "";
      position: absolute;
      top: 52px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #111;
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    #enemy::before {
      left: 35px;
    }

    #enemy::after {
      right: 35px;
    }
  </style>
</head>
<body>
  <div id="contador">Disparos: 0</div>
  <div id="reticle"></div>

  <div id="player" aria-label="Jugador">
    <div class="mouth"></div>
  </div>

  <div id="enemy" aria-label="Enemigo">
    <div class="mouth"></div>
  </div>

  <script>
    const reticle = document.getElementById('reticle');
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const contador = document.getElementById('contador');

    let playerX = 120;
    let playerY = 120;
    let enemyX = 500;
    let enemyY = 250;
    let enemyDx = 3.6;
    let enemyDy = 2.8;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let burst = 0;
    let disparos = 0;
    let lastFrame = 0;
    const keys = {};

    const speed = 7;
    const frameDuration = 1000 / 60;

    window.addEventListener('pointermove', (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;
      reticle.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
    });

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener('click', () => {
      disparos++;
      contador.textContent = 'Disparos: ' + disparos;

      burst = 2.7 + disparos * 0.5;
      enemyDx = (Math.abs(enemyDx) + 0.35 + disparos * 0.09) * (enemyDx >= 0 ? 1 : -1);
      enemyDy = (Math.abs(enemyDy) + 0.28 + disparos * 0.08) * (enemyDy >= 0 ? 1 : -1);

      enemy.style.filter = 'brightness(1.35)';

      setTimeout(() => {
        enemy.style.filter = 'none';
      }, 120);
    });

    function movePlayer(frameScale) {
      if (keys['w']) playerY -= speed * frameScale;
      if (keys['s']) playerY += speed * frameScale;
      if (keys['a']) playerX -= speed * frameScale;
      if (keys['d']) playerX += speed * frameScale;

      playerX = Math.max(0, Math.min(playerX, window.innerWidth - 150));
      playerY = Math.max(0, Math.min(playerY, window.innerHeight - 150));

      player.style.transform = `translate3d(${playerX}px, ${playerY}px, 0)`;
    }

    function moveEnemy(frameScale) {
      const enemyCenterX = enemyX + 75;
      const enemyCenterY = enemyY + 75;
      const distanceX = playerX + 75 - enemyCenterX;
      const distanceY = playerY + 75 - enemyCenterY;
      const distance = Math.hypot(distanceX, distanceY) || 1;

      if (distance < 220) {
        const force = (220 - distance) / 220;
        enemyX -= (distanceX / distance) * (9 + disparos * 1.6) * force * frameScale;
        enemyY -= (distanceY / distance) * (9 + disparos * 1.6) * force * frameScale;
      }

      enemyX += enemyDx * (1 + burst) * frameScale;
      enemyY += enemyDy * (1 + burst) * frameScale;

      if (enemyX <= 0 || enemyX >= window.innerWidth - 150) {
        enemyDx *= -1;
        enemyX = Math.max(0, Math.min(enemyX, window.innerWidth - 150));
      }

      if (enemyY <= 0 || enemyY >= window.innerHeight - 150) {
        enemyDy *= -1;
        enemyY = Math.max(0, Math.min(enemyY, window.innerHeight - 150));
      }

      enemyX = Math.max(0, Math.min(enemyX, window.innerWidth - 150));
      enemyY = Math.max(0, Math.min(enemyY, window.innerHeight - 150));

      enemy.style.transform = `translate3d(${enemyX}px, ${enemyY}px, 0) rotate(${Math.sin(enemyY / 20) * 12}deg)`;

      if (burst > 0) {
        burst *= Math.pow(0.88, frameScale);
      }
      if (burst < 0.05) {
        burst = 0;
      }
    }

    function loop(timestamp) {
      const frameScale = lastFrame ? Math.min((timestamp - lastFrame) / frameDuration, 2) : 1;
      lastFrame = timestamp;
      movePlayer(frameScale);
      moveEnemy(frameScale);
      requestAnimationFrame(loop);
    }

    player.style.transform = `translate3d(${playerX}px, ${playerY}px, 0)`;
    enemy.style.transform = `translate3d(${enemyX}px, ${enemyY}px, 0)`;

    requestAnimationFrame(loop);
  </script>
</body>
</html>
